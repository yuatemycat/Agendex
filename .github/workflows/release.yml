name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            bin_name: agendex.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            bin_name: agendex
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            bin_name: agendex
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            bin_name: agendex

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p agendex-cli

      - name: Package Windows release artifact
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $archiveName = "agendex-$tag-${{ matrix.target }}.${{ matrix.archive_ext }}"
          $stagingDir = "staging"

          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null

          # Resolve compiled binary
          $candidates = @(
            "target/${{ matrix.target }}/release/agendex.exe",
            "target/${{ matrix.target }}/release/agendex-cli.exe",
            "target/release/agendex.exe",
            "target/release/agendex-cli.exe"
          )
          $foundBinary = $null
          foreach ($cand in $candidates) {
            if (Test-Path $cand) {
              $foundBinary = $cand
              break
            }
          }
          if (-not $foundBinary) {
            Write-Error "Failed to locate compiled binary for ${{ matrix.target }}"
            exit 1
          }

          Copy-Item -Path $foundBinary -Destination "$stagingDir/${{ matrix.bin_name }}"
          Copy-Item -Path "README.md" -Destination "$stagingDir/README.md"
          if (Test-Path "LICENSE") {
            Copy-Item -Path "LICENSE" -Destination "$stagingDir/LICENSE"
          }

          Compress-Archive -Path "$stagingDir/*" -DestinationPath $archiveName
          $hash = (Get-FileHash -Path $archiveName -Algorithm SHA256).Hash.ToLower()
          "$hash  $archiveName" | Out-File -FilePath "$archiveName.sha256" -Encoding ascii

          "ARCHIVE_NAME=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CHECKSUM_NAME=$archiveName.sha256" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package Unix release artifact
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          ARCHIVE_NAME="agendex-${TAG}-${{ matrix.target }}.${{ matrix.archive_ext }}"
          STAGING_DIR="staging"

          mkdir -p "$STAGING_DIR"

          # Resolve compiled binary
          CANDIDATES=(
            "target/${{ matrix.target }}/release/agendex"
            "target/${{ matrix.target }}/release/agendex-cli"
            "target/release/agendex"
            "target/release/agendex-cli"
          )
          FOUND_BINARY=""
          for CAND in "${CANDIDATES[@]}"; do
            if [ -f "$CAND" ]; then
              FOUND_BINARY="$CAND"
              break
            fi
          done

          if [ -z "$FOUND_BINARY" ]; then
            echo "Failed to locate compiled binary for ${{ matrix.target }}"
            exit 1
          fi

          cp "$FOUND_BINARY" "$STAGING_DIR/${{ matrix.bin_name }}"
          chmod +x "$STAGING_DIR/${{ matrix.bin_name }}"
          cp README.md "$STAGING_DIR/README.md"
          if [ -f "LICENSE" ]; then
            cp LICENSE "$STAGING_DIR/LICENSE"
          fi

          tar -czvf "$ARCHIVE_NAME" -C "$STAGING_DIR" .

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          else
            shasum -a 256 "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          fi

          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV
          echo "CHECKSUM_NAME=${ARCHIVE_NAME}.sha256" >> $GITHUB_ENV

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.CHECKSUM_NAME }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
